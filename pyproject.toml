[project]
name = "siwc-proxy"
version = "0.2.0"
description = "Local OpenAI-compatible API proxy for Sign in with ChatGPT token sharing"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Nyamkhuu Demberelsuren" }]
keywords = ["openai", "chatgpt", "proxy", "oauth", "sign-in-with-chatgpt", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "anyio>=4.4",
    "authlib>=1.8,<1.9",
    "click>=8.1",
    "fastapi>=0.115",
    "filelock>=3.16",
    "httpx2>=2.13,<3",
    "itsdangerous>=2.2",
    "joserfc>=1.6",
    "platformdirs>=4.3",
    "pydantic-settings>=2.7",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/d-nyamkhuu/siwc-proxy"
Documentation = "https://github.com/d-nyamkhuu/siwc-proxy/blob/main/docs/proxy.md"
Source = "https://github.com/d-nyamkhuu/siwc-proxy"
Issues = "https://github.com/d-nyamkhuu/siwc-proxy/issues"

[project.scripts]
siwc-proxy = "siwc_proxy.cli:main"

[dependency-groups]
dev = [
    "openai>=3,<4",
    "pytest>=8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["siwc_proxy"]

[tool.hatch.build.targets.sdist]
include = ["siwc_proxy", "tests", "docs", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::authlib.deprecate.AuthlibDeprecationWarning"]
